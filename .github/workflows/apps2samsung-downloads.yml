      - name: Inspect UltimatiumTube entry
        run: |
          python3 - <<'PY'
          import json

          with open("resolved.json") as f:
              data = json.load(f)

          def search(obj):
              if isinstance(obj, dict):
                  if "UltimatiumTube" in json.dumps(obj):
                      print(json.dumps(obj, indent=2))
                  for value in obj.values():
                      search(value)
              elif isinstance(obj, list):
                  for value in obj:
                      search(value)

          search(data)
          PY
