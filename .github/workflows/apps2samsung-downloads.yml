
name: Update Apps2Samsung Downloads

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Apps2Samsung catalogue
        run: |
          curl -fsSL \
            https://apps2samsung.com/catalog/resolved.json \
            -o resolved.json

      - name: Inspect catalogue
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open("resolved.json"))
          print(json.dumps(data, indent=2)[:20000])
          PY
