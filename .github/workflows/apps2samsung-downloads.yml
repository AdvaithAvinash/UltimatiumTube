
name: Update Apps2Samsung Downloads

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Apps2Samsung catalogue
        run: |
          curl -fLsS \
            https://apps2samsung.com/catalog/resolved.json \
            -o resolved.json

      - name: Inspect UltimatiumTube entry
        run: |
          python3 - <<'PY'
          import json

          with open("resolved.json", encoding="utf-8") as f:
              data = json.load(f)

          def search(obj):
              if isinstance(obj, dict):
                  if "UltimatiumTube" in json.dumps(obj):
                      print(json.dumps(obj, indent=2))
                  for value in obj.values():
                      search(value)
              elif isinstance(obj, list):
                  for value in obj:
                      search(value)

          search(data)
          PY
